<section class="auth-page">
    <div class="auth-card">

        <div class="auth-card__header">
            <h1 class="auth-card__title">Connexion</h1>
            <p class="auth-card__subtitle">Accédez à votre espace personnel</p>
        </div>

        <div class="auth-alert auth-alert--error" id="signin-error" style="display:none;"></div>
        <div class="auth-alert auth-alert--success" id="signin-success" style="display:none;"></div>

        <form id="signin-form" novalidate>

            <div class="auth-field">
                <label class="auth-field__label" for="signin-email">Adresse e-mail</label>
                <input class="auth-field__input" type="email" id="signin-email" placeholder="julie@exemple.fr" autocomplete="email" required>
                <span class="auth-field__error" id="err-email"></span>
            </div>

            <div class="auth-field">
                <label class="auth-field__label" for="signin-password">Mot de passe</label>
                <div class="auth-field__input-wrap">
                    <input class="auth-field__input" type="password" id="signin-password" placeholder="••••••••••" autocomplete="current-password" required>
                    <button type="button" class="auth-field__eye" id="toggle-password" aria-label="Afficher le mot de passe">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                <span class="auth-field__error" id="err-password"></span>
            </div>

            <div class="auth-card__forgot">
                <a href="#" id="forgot-link">Mot de passe oublié ?</a>
            </div>

            <button type="submit" class="auth-btn" id="signin-btn">
                <i class="bi bi-box-arrow-in-right"></i> Se connecter
            </button>

        </form>

        <!-- Formulaire mot de passe oublié (caché par défaut) -->
        <div id="forgot-form-wrap" style="display:none;">
            <hr class="auth-sep">
            <p class="auth-card__forgot-title"><i class="bi bi-envelope"></i> Réinitialisation du mot de passe</p>
            <div class="auth-field">
                <label class="auth-field__label" for="forgot-email">Votre adresse e-mail</label>
                <input class="auth-field__input" type="email" id="forgot-email" placeholder="julie@exemple.fr">
            </div>
            <button type="button" class="auth-btn auth-btn--secondary" id="forgot-submit">
                Envoyer le lien de réinitialisation
            </button>
        </div>

        <hr class="auth-sep">

        <p class="auth-card__switch">
            Pas encore de compte ?
            <a href="/signup" onclick="route(event)">Créer un compte</a>
        </p>

    </div>
</section>
