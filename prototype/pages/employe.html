<section class="employe-page">
    <div class="container-fluid py-4 px-4">

        <div class="employe-topbar">
            <h1 class="employe-topbar__title"><i class="bi bi-briefcase-fill"></i> Espace Employé</h1>
            <span class="employe-topbar__badge" id="employe-badge">—</span>
        </div>

        <!-- Onglets -->
        <div class="employe-tabs">
            <button class="employe-tabs__btn active" data-tab="commandes">
                <i class="bi bi-bag-fill"></i> Commandes
                <span class="employe-tabs__count" id="tab-count-commandes">0</span>
            </button>
            <button class="employe-tabs__btn" data-tab="plats">
                <i class="bi bi-bowl-hot-fill"></i> Plats
            </button>
            <button class="employe-tabs__btn" data-tab="menus">
                <i class="bi bi-egg-fried"></i> Menus
            </button>
            <button class="employe-tabs__btn" data-tab="avis">
                <i class="bi bi-star-fill"></i> Avis
                <span class="employe-tabs__count" id="tab-count-avis">0</span>
            </button>
        </div>

        <!-- ── COMMANDES ──────────────────────────────────────────────── -->
        <div class="employe-panel" id="tab-commandes">

            <div class="employe-filters">
                <select class="employe-filters__select" id="filter-statut">
                    <option value="">Tous les statuts</option>
                    <option value="En attente">En attente</option>
                    <option value="Confirmée">Confirmée</option>
                    <option value="En préparation">En préparation</option>
                    <option value="Livrée">Livrée</option>
                    <option value="Annulée">Annulée</option>
                </select>
                <input class="employe-filters__search" type="text" id="filter-search"
                       placeholder="Rechercher par nom, e-mail ou ID…">
            </div>

            <div class="employe-table-wrap">
                <table class="employe-table" id="commandes-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Client</th>
                            <th>Menu</th>
                            <th>Date prestation</th>
                            <th>Total</th>
                            <th>Statut</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="commandes-tbody"></tbody>
                </table>
                <p class="employe-empty" id="commandes-empty" style="display:none;">
                    Aucune commande trouvée.
                </p>
            </div>
        </div>

        <!-- ── PLATS ──────────────────────────────────────────────────── -->
        <div class="employe-panel" id="tab-plats" style="display:none;">

            <div class="employe-menus-toolbar">
                <button class="employe-btn employe-btn--primary" id="plat-add-btn">
                    <i class="bi bi-plus-lg"></i> Ajouter un plat
                </button>
            </div>

            <div class="employe-plats-grid" id="plats-grid"></div>
        </div>

        <!-- ── MENUS ─────────────────────────────────────────────────── -->
        <div class="employe-panel" id="tab-menus" style="display:none;">

            <div class="employe-menus-toolbar">
                <button class="employe-btn employe-btn--primary" id="menu-add-btn">
                    <i class="bi bi-plus-lg"></i> Ajouter un menu
                </button>
            </div>

            <div class="employe-menus-grid" id="menus-grid"></div>

            <!-- Horaires -->
            <div class="employe-horaires">
                <h2 class="employe-horaires__title"><i class="bi bi-clock-fill"></i> Horaires d'ouverture</h2>
                <div class="employe-horaires__grid" id="horaires-grid"></div>
                <div class="employe-horaires__actions">
                    <button class="employe-btn employe-btn--primary" id="horaires-save">
                        <i class="bi bi-floppy-fill"></i> Enregistrer les horaires
                    </button>
                    <span class="employe-horaires__feedback" id="horaires-feedback"></span>
                </div>
            </div>
        </div>

        <!-- ── AVIS ──────────────────────────────────────────────────── -->
        <div class="employe-panel" id="tab-avis" style="display:none;">
            <div id="avis-list"></div>
            <p class="employe-empty" id="avis-empty" style="display:none;">
                Aucun avis en attente de validation.
            </p>
        </div>

    </div>
</section>

<!-- ── MODAL PLAT ──────────────────────────────────────────────────────────── -->
<div class="employe-overlay" id="plat-modal-overlay" style="display:none;">
    <div class="employe-modal">
        <div class="employe-modal__header">
            <h2 class="employe-modal__title" id="plat-modal-title">Plat</h2>
            <button class="employe-modal__close" id="plat-modal-close"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="employe-modal__body">
            <input type="hidden" id="plat-edit-id">

            <div class="auth-row">
                <div class="auth-field" style="flex:2">
                    <label class="auth-field__label" for="plat-edit-nom">Nom du plat</label>
                    <input class="auth-field__input" type="text" id="plat-edit-nom" placeholder="Ex : Magret de canard aux cèpes">
                    <span class="auth-field__error" id="err-plat-nom"></span>
                </div>
                <div class="auth-field">
                    <label class="auth-field__label" for="plat-edit-type">Type</label>
                    <select class="auth-field__input" id="plat-edit-type">
                        <option value="entree">Entrée</option>
                        <option value="plat">Plat</option>
                        <option value="dessert">Dessert</option>
                    </select>
                </div>
            </div>

            <div class="auth-field">
                <label class="auth-field__label">Allergènes</label>
                <div class="employe-allergen-grid" id="plat-allergen-grid"></div>
            </div>

            <div class="auth-field">
                <label class="auth-field__label" for="plat-edit-photo">Photo du plat</label>
                <input class="auth-field__input" type="file" id="plat-edit-photo" accept="image/*">
                <div class="plat-photo-preview" id="plat-photo-preview" style="display:none;">
                    <img id="plat-photo-img" src="" alt="Aperçu">
                    <button type="button" class="plat-photo-remove" id="plat-photo-remove">
                        <i class="bi bi-x-circle-fill"></i>
                    </button>
                </div>
            </div>
        </div>
        <div class="employe-modal__footer">
            <button class="auth-btn auth-btn--secondary" id="plat-modal-cancel">Annuler</button>
            <button class="auth-btn" id="plat-modal-save">
                <i class="bi bi-floppy-fill"></i> Enregistrer
            </button>
        </div>
    </div>
</div>

<!-- ── MODAL MENU ─────────────────────────────────────────────────────────── -->
<div class="employe-overlay" id="menu-modal-overlay" style="display:none;">
    <div class="employe-modal">
        <div class="employe-modal__header">
            <h2 class="employe-modal__title" id="menu-modal-title">Menu</h2>
            <button class="employe-modal__close" id="menu-modal-close"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="employe-modal__body">
            <input type="hidden" id="menu-edit-id">

            <div class="auth-row">
                <div class="auth-field">
                    <label class="auth-field__label" for="menu-edit-name">Nom du menu</label>
                    <input class="auth-field__input" type="text" id="menu-edit-name">
                </div>
                <div class="auth-field">
                    <label class="auth-field__label" for="menu-edit-price">Prix (€/plat)</label>
                    <input class="auth-field__input" type="number" id="menu-edit-price" step="0.10" min="0">
                </div>
            </div>

            <div class="auth-row">
                <div class="auth-field">
                    <label class="auth-field__label" for="menu-edit-min">Minimum de plats</label>
                    <input class="auth-field__input" type="number" id="menu-edit-min" min="1">
                </div>
                <div class="auth-field">
                    <label class="auth-field__label" for="menu-edit-max">Maximum de plats</label>
                    <input class="auth-field__input" type="number" id="menu-edit-max" min="1">
                </div>
            </div>

            <div class="auth-row">
                <div class="auth-field">
                    <label class="auth-field__label" for="menu-edit-stock">Stock disponible</label>
                    <input class="auth-field__input" type="number" id="menu-edit-stock" min="0">
                </div>
                <div class="auth-field">
                    <label class="auth-field__label" for="menu-edit-active">Statut</label>
                    <select class="auth-field__input" id="menu-edit-active">
                        <option value="1">Actif</option>
                        <option value="0">Inactif</option>
                    </select>
                </div>
            </div>

            <div class="auth-field">
                <label class="auth-field__label" for="menu-edit-desc">Description courte</label>
                <textarea class="auth-field__input contact-textarea" id="menu-edit-desc" rows="2"></textarea>
            </div>

            <div class="employe-modal__section-title"><i class="bi bi-list-ul"></i> Composition du menu</div>

            <div class="employe-plat-row">
                <span class="employe-plat-row__label employe-type-badge--entree">Entrée</span>
                <div class="employe-plat-row__fields">
                    <select class="auth-field__input" id="course-entree"></select>
                </div>
            </div>
            <div class="employe-plat-row">
                <span class="employe-plat-row__label employe-type-badge--plat">Plat</span>
                <div class="employe-plat-row__fields">
                    <select class="auth-field__input" id="course-plat"></select>
                </div>
            </div>
            <div class="employe-plat-row">
                <span class="employe-plat-row__label employe-type-badge--dessert">Dessert</span>
                <div class="employe-plat-row__fields">
                    <select class="auth-field__input" id="course-dessert"></select>
                </div>
            </div>
        </div>
        <div class="employe-modal__footer">
            <button class="auth-btn auth-btn--secondary" id="menu-modal-cancel">Annuler</button>
            <button class="auth-btn" id="menu-modal-save"><i class="bi bi-floppy-fill"></i> Enregistrer</button>
        </div>
    </div>
</div>
