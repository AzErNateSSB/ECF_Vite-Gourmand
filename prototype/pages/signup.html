<section class="auth-page">
    <div class="auth-card auth-card--wide">

        <div class="auth-card__header">
            <h1 class="auth-card__title">Créer un compte</h1>
            <p class="auth-card__subtitle">Rejoignez Vite &amp; Gourmand pour commander en ligne</p>
        </div>

        <div class="auth-alert auth-alert--error" id="signup-error" style="display:none;"></div>
        <div class="auth-alert auth-alert--success" id="signup-success" style="display:none;"></div>

        <form id="signup-form" novalidate>

            <div class="auth-row">
                <div class="auth-field">
                    <label class="auth-field__label" for="signup-prenom">Prénom</label>
                    <input class="auth-field__input" type="text" id="signup-prenom" placeholder="Julie" autocomplete="given-name" required>
                    <span class="auth-field__error" id="err-prenom"></span>
                </div>
                <div class="auth-field">
                    <label class="auth-field__label" for="signup-nom">Nom</label>
                    <input class="auth-field__input" type="text" id="signup-nom" placeholder="Dupont" autocomplete="family-name" required>
                    <span class="auth-field__error" id="err-nom"></span>
                </div>
            </div>

            <div class="auth-field">
                <label class="auth-field__label" for="signup-email">Adresse e-mail</label>
                <input class="auth-field__input" type="email" id="signup-email" placeholder="julie@exemple.fr" autocomplete="email" required>
                <span class="auth-field__error" id="err-signup-email"></span>
            </div>

            <div class="auth-field">
                <label class="auth-field__label" for="signup-gsm">Numéro de téléphone</label>
                <input class="auth-field__input" type="tel" id="signup-gsm" placeholder="06 12 34 56 78" autocomplete="tel" required>
                <span class="auth-field__error" id="err-gsm"></span>
            </div>

            <div class="auth-field">
                <label class="auth-field__label" for="signup-adresse">Adresse postale</label>
                <input class="auth-field__input" type="text" id="signup-adresse" placeholder="12 rue des Vignes, 33000 Bordeaux" autocomplete="street-address" required>
                <span class="auth-field__error" id="err-adresse"></span>
            </div>

            <div class="auth-field">
                <label class="auth-field__label" for="signup-password">Mot de passe</label>
                <div class="auth-field__input-wrap">
                    <input class="auth-field__input" type="password" id="signup-password" placeholder="••••••••••" autocomplete="new-password" required>
                    <button type="button" class="auth-field__eye" id="toggle-signup-password" aria-label="Afficher le mot de passe">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                <div class="auth-password-strength" id="password-strength">
                    <div class="auth-password-strength__bar">
                        <span id="strength-bar"></span>
                    </div>
                    <span class="auth-password-strength__label" id="strength-label"></span>
                </div>
                <ul class="auth-password-rules" id="password-rules">
                    <li id="rule-length"><i class="bi bi-x-circle-fill"></i> 10 caractères minimum</li>
                    <li id="rule-upper"><i class="bi bi-x-circle-fill"></i> Une majuscule</li>
                    <li id="rule-lower"><i class="bi bi-x-circle-fill"></i> Une minuscule</li>
                    <li id="rule-digit"><i class="bi bi-x-circle-fill"></i> Un chiffre</li>
                    <li id="rule-special"><i class="bi bi-x-circle-fill"></i> Un caractère spécial</li>
                </ul>
                <span class="auth-field__error" id="err-signup-password"></span>
            </div>

            <div class="auth-field">
                <label class="auth-field__label" for="signup-confirm">Confirmer le mot de passe</label>
                <div class="auth-field__input-wrap">
                    <input class="auth-field__input" type="password" id="signup-confirm" placeholder="••••••••••" autocomplete="new-password" required>
                    <button type="button" class="auth-field__eye" id="toggle-confirm-password" aria-label="Afficher le mot de passe">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                <span class="auth-field__error" id="err-confirm"></span>
            </div>

            <button type="submit" class="auth-btn" id="signup-btn">
                <i class="bi bi-person-plus"></i> Créer mon compte
            </button>

        </form>

        <hr class="auth-sep">

        <p class="auth-card__switch">
            Déjà un compte ?
            <a href="/signin" onclick="route(event)">Se connecter</a>
        </p>

    </div>
</section>
