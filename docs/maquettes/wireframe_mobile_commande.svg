<svg viewBox="0 0 340 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <title>Wireframe Mobile — Formulaire de commande</title>
  <rect width="340" height="900" fill="#f7f7f7"/>
  <text x="170" y="13" text-anchor="middle" font-size="10" fill="#aaa">Wireframe Mobile — Commande (390px) — basse fidélité</text>

  <!-- Contour téléphone -->
  <rect x="30" y="20" width="280" height="868" rx="20" fill="white" stroke="#ccc" stroke-width="2"/>

  <!-- Barre de statut -->
  <rect x="30" y="20" width="280" height="24" rx="20" fill="#e9ecef"/>
  <text x="170" y="36" text-anchor="middle" font-size="8" fill="#bbb">9:41  ●●●  WiFi  🔋</text>

  <!-- Navbar -->
  <rect x="30" y="44" width="280" height="40" fill="#ddd"/>
  <rect x="46" y="52" width="60" height="22" rx="3" fill="#bbb"/>
  <text x="76" y="67" text-anchor="middle" font-size="9" fill="#555">LOGO</text>
  <text x="284" y="70" text-anchor="middle" font-size="12" fill="#888">☰</text>

  <!-- Titre -->
  <rect x="46" y="94" width="200" height="16" rx="3" fill="#e0e0e0"/>
  <text x="146" y="106" text-anchor="middle" font-size="9" fill="#888">Passer une commande</text>

  <!-- Formulaire (empilé) -->
  <text x="46" y="124" font-size="8" fill="#aaa">Menu</text>
  <rect x="46" y="128" width="248" height="22" rx="3" fill="#ebebeb" stroke="#ddd"/>

  <text x="46" y="162" font-size="8" fill="#aaa">Date de prestation</text>
  <rect x="46" y="166" width="248" height="22" rx="3" fill="#ebebeb" stroke="#ddd"/>

  <text x="46" y="200" font-size="8" fill="#aaa">Heure de livraison</text>
  <rect x="46" y="204" width="248" height="22" rx="3" fill="#ebebeb" stroke="#ddd"/>

  <text x="46" y="238" font-size="8" fill="#aaa">Adresse de livraison</text>
  <rect x="46" y="242" width="248" height="22" rx="3" fill="#ebebeb" stroke="#ddd"/>

  <text x="46" y="276" font-size="8" fill="#aaa">Ville</text>
  <rect x="46" y="280" width="248" height="22" rx="3" fill="#ebebeb" stroke="#ddd"/>

  <text x="46" y="314" font-size="8" fill="#aaa">Nombre de personnes</text>
  <rect x="46" y="318" width="248" height="22" rx="3" fill="#ebebeb" stroke="#ddd"/>

  <!-- Checkbox -->
  <rect x="46" y="352" width="12" height="12" rx="2" fill="#ddd" stroke="#bbb"/>
  <text x="64" y="362" font-size="8" fill="#888">[ ] Prêt matériel</text>

  <!-- Récap dynamique -->
  <rect x="46" y="378" width="248" height="100" rx="4" fill="#f0f0f0" stroke="#ddd"/>
  <text x="170" y="398" text-anchor="middle" font-size="9" fill="#aaa">— Récapitulatif prix —</text>
  <text x="58" y="420" font-size="8" fill="#bbb">Menu :</text>
  <text x="286" y="420" text-anchor="end" font-size="8" fill="#bbb">XX,XX €</text>
  <text x="58" y="438" font-size="8" fill="#bbb">Livraison :</text>
  <text x="286" y="438" text-anchor="end" font-size="8" fill="#bbb">XX,XX €</text>
  <line x1="58" y1="448" x2="286" y2="448" stroke="#ddd" stroke-width="1"/>
  <text x="58" y="466" font-size="9" fill="#888">Total :</text>
  <text x="286" y="466" text-anchor="end" font-size="9" fill="#888">XX,XX €</text>

  <!-- CTA -->
  <rect x="46" y="492" width="248" height="36" rx="18" fill="#bbb"/>
  <text x="170" y="514" text-anchor="middle" font-size="10" fill="#555">[ Confirmer ]</text>

  <!-- Aperçu menu sélectionné (en dessous sur mobile) -->
  <text x="46" y="546" font-size="9" fill="#aaa">Menu sélectionné :</text>
  <rect x="46" y="554" width="248" height="140" rx="4" fill="#f0f0f0" stroke="#ddd"/>
  <rect x="46" y="554" width="248" height="70" rx="4" fill="#e0e0e0"/>
  <text x="170" y="593" text-anchor="middle" font-size="9" fill="#bbb">[ Photo menu ]</text>
  <rect x="58" y="632" width="160" height="10" rx="2" fill="#d5d5d5"/>
  <rect x="58" y="650" width="220" height="8" rx="2" fill="#e0e0e0"/>
  <rect x="58" y="666" width="180" height="8" rx="2" fill="#e0e0e0"/>
  <text x="58" y="684" font-size="8" fill="#aaa">Allergènes : [ ... ]</text>

  <!-- Footer -->
  <rect x="30" y="848" width="280" height="40" rx="20" fill="#e0e0e0"/>
  <text x="170" y="872" text-anchor="middle" font-size="8" fill="#999">[ Footer mobile ]</text>
</svg>
