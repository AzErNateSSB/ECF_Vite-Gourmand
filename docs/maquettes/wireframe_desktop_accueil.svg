  <rect x="184" y="234" width="130" height="30" rx="15" fill="none" stroke="#bbb" stroke-width="1.5"/>
  <text x="249" y="253" text-anchor="middle" font-size="9" fill="#888">[ CTA Secondaire ]</text>

  <!-- Section atouts -->
  <rect x="20" y="322" width="960" height="140" fill="white"/>
  <text x="500" y="348" text-anchor="middle" font-size="11" fill="#888">Section — Nos atouts (3 colonnes)</text>
  <rect x="60" y="358" width="260" height="80" rx="4" fill="#f0f0f0" stroke="#ddd"/>
  <text x="190" y="403" text-anchor="middle" font-size="10" fill="#aaa">[ Icône + Titre + Texte ]</text>
  <rect x="370" y="358" width="260" height="80" rx="4" fill="#f0f0f0" stroke="#ddd"/>
  <text x="500" y="403" text-anchor="middle" font-size="10" fill="#aaa">[ Icône + Titre + Texte ]</text>
  <rect x="680" y="358" width="260" height="80" rx="4" fill="#f0f0f0" stroke="#ddd"/>
  <text x="810" y="403" text-anchor="middle" font-size="10" fill="#aaa">[ Icône + Titre + Texte ]</text>

  <!-- Section menus aperçu -->
  <rect x="20" y="462" width="960" height="100" fill="#f5f5f5"/>
  <text x="500" y="488" text-anchor="middle" font-size="11" fill="#888">Section — Aperçu menus (cards horizontales)</text>
  <rect x="60" y="498" width="180" height="50" rx="3" fill="#e0e0e0"/>
  <rect x="260" y="498" width="180" height="50" rx="3" fill="#e0e0e0"/>
  <rect x="460" y="498" width="180" height="50" rx="3" fill="#e0e0e0"/>
