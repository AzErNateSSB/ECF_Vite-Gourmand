<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <title>Wireframe Desktop — Accueil</title>
  <rect width="1000" height="620" fill="#f7f7f7"/>
