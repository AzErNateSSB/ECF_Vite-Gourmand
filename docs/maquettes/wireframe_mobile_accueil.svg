<svg viewBox="0 0 340 680" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <title>Wireframe Mobile — Accueil</title>
  <rect width="340" height="680" fill="#f7f7f7"/>
  <text x="170" y="13" text-anchor="middle" font-size="10" fill="#aaa">Wireframe Mobile — Accueil (390px) — basse fidélité</text>

  <!-- Contour téléphone -->
  <rect x="30" y="20" width="280" height="648" rx="20" fill="white" stroke="#ccc" stroke-width="2"/>

  <!-- Barre de statut -->
  <rect x="30" y="20" width="280" height="24" rx="20" fill="#e9ecef"/>
  <text x="170" y="36" text-anchor="middle" font-size="8" fill="#bbb">9:41  ●●●  WiFi  🔋</text>

  <!-- Navbar mobile -->
  <rect x="30" y="44" width="280" height="40" fill="#ddd"/>
  <rect x="46" y="52" width="60" height="22" rx="3" fill="#bbb"/>
  <text x="76" y="67" text-anchor="middle" font-size="9" fill="#555">LOGO</text>
  <rect x="274" y="54" width="20" height="4" rx="1" fill="#888"/>
  <rect x="274" y="62" width="20" height="4" rx="1" fill="#888"/>
  <rect x="274" y="70" width="20" height="4" rx="1" fill="#888"/>
  <text x="284" y="78" text-anchor="middle" font-size="7" fill="#888">☰</text>

  <!-- Hero mobile -->
  <rect x="30" y="84" width="280" height="160" fill="#e0e0e0"/>
  <text x="170" y="118" text-anchor="middle" font-size="10" fill="#bbb">[ Image hero ]</text>
  <rect x="46" y="130" width="180" height="18" rx="3" fill="#ccc"/>
  <text x="136" y="143" text-anchor="middle" font-size="9" fill="#666">Titre H1</text>
  <rect x="46" y="156" width="150" height="10" rx="2" fill="#d5d5d5"/>
  <rect x="46" y="172" width="130" height="24" rx="12" fill="#bbb"/>
  <text x="111" y="188" text-anchor="middle" font-size="8" fill="#555">[ Commander ]</text>

  <!-- Section atouts (empilés) -->
  <rect x="46" y="258" width="248" height="54" rx="3" fill="#f0f0f0" stroke="#ddd"/>
  <text x="170" y="288" text-anchor="middle" font-size="9" fill="#aaa">[ Icône + Titre + Texte ]</text>
  <rect x="46" y="320" width="248" height="54" rx="3" fill="#f0f0f0" stroke="#ddd"/>
  <text x="170" y="350" text-anchor="middle" font-size="9" fill="#aaa">[ Icône + Titre + Texte ]</text>
  <rect x="46" y="382" width="248" height="54" rx="3" fill="#f0f0f0" stroke="#ddd"/>
  <text x="170" y="412" text-anchor="middle" font-size="9" fill="#aaa">[ Icône + Titre + Texte ]</text>

  <!-- Aperçu menus (cards empilées) -->
  <text x="46" y="456" font-size="9" fill="#aaa">Aperçu menus :</text>
  <rect x="46" y="462" width="248" height="60" rx="3" fill="#e5e5e5" stroke="#ddd"/>
  <rect x="46" y="462" width="80" height="60" rx="3" fill="#d5d5d5"/>
  <rect x="136" y="470" width="140" height="10" rx="2" fill="#ccc"/>
  <rect x="136" y="488" width="100" height="8" rx="2" fill="#ddd"/>
  <rect x="136" y="502" width="80" height="8" rx="2" fill="#ddd"/>

  <rect x="46" y="530" width="248" height="60" rx="3" fill="#e5e5e5" stroke="#ddd"/>
  <rect x="46" y="530" width="80" height="60" rx="3" fill="#d5d5d5"/>
  <rect x="136" y="538" width="140" height="10" rx="2" fill="#ccc"/>
  <rect x="136" y="556" width="100" height="8" rx="2" fill="#ddd"/>

  <!-- Footer -->
  <rect x="30" y="628" width="280" height="40" rx="20" fill="#e0e0e0"/>
  <text x="170" y="652" text-anchor="middle" font-size="8" fill="#999">[ Footer mobile ]</text>
</svg>
