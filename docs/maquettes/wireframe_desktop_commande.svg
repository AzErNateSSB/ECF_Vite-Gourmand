<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <title>Wireframe Desktop — Formulaire de commande</title>
  <rect width="1000" height="720" fill="#f7f7f7"/>
  <text x="500" y="15" text-anchor="middle" font-size="11" fill="#aaa">Wireframe Desktop — Formulaire de commande (1440px) — basse fidélité</text>

  <!-- Fenêtre navigateur -->
  <rect x="20" y="22" width="960" height="680" rx="6" fill="white" stroke="#ccc" stroke-width="1"/>
  <rect x="20" y="22" width="960" height="26" rx="6" fill="#e9ecef"/>
  <circle cx="38" cy="35" r="4" fill="#ccc"/>
  <circle cx="52" cy="35" r="4" fill="#ccc"/>
  <circle cx="66" cy="35" r="4" fill="#ccc"/>
  <rect x="180" y="27" width="640" height="14" rx="7" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="500" y="38" text-anchor="middle" font-size="8" fill="#bbb">localhost:8081/commande</text>

  <!-- Navbar -->
  <rect x="20" y="48" width="960" height="44" fill="#ddd"/>
  <rect x="36" y="58" width="90" height="24" rx="3" fill="#bbb"/>
  <text x="81" y="74" text-anchor="middle" font-size="10" fill="#555">LOGO</text>
  <rect x="882" y="61" width="80" height="18" rx="9" fill="#bbb"/>

  <!-- Titre de page -->
  <rect x="40" y="106" width="240" height="22" rx="3" fill="#e0e0e0"/>
  <text x="160" y="121" text-anchor="middle" font-size="11" fill="#888">Passer une commande</text>

  <!-- Layout 2 colonnes -->
  <!-- Col gauche : formulaire -->
  <rect x="36" y="138" width="560" height="540" rx="4" fill="#f9f9f9" stroke="#e0e0e0"/>
  <text x="316" y="160" text-anchor="middle" font-size="10" fill="#bbb">— Formulaire de commande —</text>

  <!-- Champs formulaire -->
  <rect x="52" y="168" width="528" height="14" rx="2" fill="#e5e5e5"/>
  <text x="52" y="162" font-size="9" fill="#aaa">Menu</text>
  <rect x="52" y="202" width="250" height="14" rx="2" fill="#e5e5e5"/>
  <text x="52" y="196" font-size="9" fill="#aaa">Date de prestation</text>
  <rect x="318" y="202" width="262" height="14" rx="2" fill="#e5e5e5"/>
  <text x="318" y="196" font-size="9" fill="#aaa">Heure de livraison</text>
  <rect x="52" y="236" width="528" height="14" rx="2" fill="#e5e5e5"/>
  <text x="52" y="230" font-size="9" fill="#aaa">Adresse de livraison</text>
  <rect x="52" y="270" width="250" height="14" rx="2" fill="#e5e5e5"/>
  <text x="52" y="264" font-size="9" fill="#aaa">Ville</text>
  <rect x="318" y="270" width="262" height="14" rx="2" fill="#e5e5e5"/>
  <text x="318" y="264" font-size="9" fill="#aaa">Nombre de personnes</text>

  <!-- Options -->
  <rect x="52" y="314" width="14" height="14" rx="2" fill="#ddd" stroke="#bbb"/>
  <text x="74" y="325" font-size="9" fill="#888">[ ] Prêt matériel (tables, chaises...)</text>

  <!-- Récap dynamique -->
  <rect x="52" y="348" width="528" height="90" rx="4" fill="#ebebeb" stroke="#ddd"/>
  <text x="316" y="368" text-anchor="middle" font-size="10" fill="#aaa">— Récapitulatif prix (mis à jour dynamiquement) —</text>
  <rect x="68" y="378" width="200" height="10" rx="2" fill="#ddd"/>
  <text x="430" y="388" text-anchor="end" font-size="9" fill="#aaa">XX,XX €</text>
  <rect x="68" y="396" width="160" height="10" rx="2" fill="#ddd"/>
  <text x="430" y="406" text-anchor="end" font-size="9" fill="#aaa">XX,XX €</text>
  <rect x="68" y="416" width="180" height="10" rx="2" fill="#ccc"/>
  <text x="430" y="426" text-anchor="end" font-size="10" fill="#888">Total : XX,XX €</text>

  <!-- CTA -->
  <rect x="52" y="454" width="528" height="36" rx="18" fill="#bbb"/>
  <text x="316" y="476" text-anchor="middle" font-size="11" fill="#555">[ Confirmer la commande ]</text>

  <!-- Col droite : résumé menu choisi -->
  <rect x="612" y="138" width="348" height="540" rx="4" fill="#f0f0f0" stroke="#e0e0e0"/>
  <text x="786" y="160" text-anchor="middle" font-size="10" fill="#bbb">— Aperçu du menu sélectionné —</text>
  <rect x="628" y="168" width="316" height="160" rx="3" fill="#ddd"/>
  <text x="786" y="252" text-anchor="middle" font-size="10" fill="#bbb">[ Photo menu ]</text>
  <rect x="628" y="338" width="200" height="14" rx="2" fill="#d5d5d5"/>
  <rect x="628" y="362" width="316" height="10" rx="2" fill="#e0e0e0"/>
  <rect x="628" y="380" width="280" height="10" rx="2" fill="#e0e0e0"/>
  <rect x="628" y="398" width="260" height="10" rx="2" fill="#e0e0e0"/>
  <text x="628" y="430" font-size="9" fill="#aaa">Plats inclus :</text>
  <rect x="628" y="438" width="200" height="10" rx="2" fill="#e5e5e5"/>
  <rect x="628" y="456" width="180" height="10" rx="2" fill="#e5e5e5"/>
  <rect x="628" y="474" width="220" height="10" rx="2" fill="#e5e5e5"/>
  <text x="628" y="510" font-size="10" fill="#bbb">Allergènes : [ liste ]</text>
  <text x="628" y="530" font-size="10" fill="#bbb">Régimes : [ liste ]</text>

  <!-- Footer -->
  <rect x="20" y="698" width="960" height="24" fill="#ddd"/>
  <text x="500" y="714" text-anchor="middle" font-size="9" fill="#999">[ Footer ]</text>
</svg>
