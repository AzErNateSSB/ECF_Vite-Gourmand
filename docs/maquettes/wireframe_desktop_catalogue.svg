  <rect x="680" y="382" width="284" height="110" rx="4" fill="#e0e0e0"/>
  <text x="822" y="440" text-anchor="middle" font-size="10" fill="#bbb">[ Photo menu ]</text>
  <rect x="692" y="502" width="160" height="12" rx="2" fill="#d5d5d5"/>
  <rect x="692" y="522" width="220" height="10" rx="2" fill="#e0e0e0"/>
  <text x="704" y="565" font-size="9" fill="#aaa">XX €/pers.</text>

