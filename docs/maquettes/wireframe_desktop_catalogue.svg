  <rect x="36" y="382" width="284" height="190" rx="4" fill="#f0f0f0" stroke="#ddd"/>
  <rect x="36" y="382" width="284" height="110" rx="4" fill="#e0e0e0"/>
  <text x="178" y="440" text-anchor="middle" font-size="10" fill="#bbb">[ Photo menu ]</text>
