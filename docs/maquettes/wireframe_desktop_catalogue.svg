<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <title>Wireframe Desktop — Catalogue des menus</title>
  <rect width="1000" height="680" fill="#f7f7f7"/>
  <text x="500" y="15" text-anchor="middle" font-size="11" fill="#aaa">Wireframe Desktop — Catalogue des menus (1440px) — basse fidélité</text>

  <!-- Fenêtre navigateur -->
  <rect x="20" y="22" width="960" height="640" rx="6" fill="white" stroke="#ccc" stroke-width="1"/>
