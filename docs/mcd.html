<title>MCD Vite & Gourmand</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap">

<style>
:root {
  --bg: #FAF7F5;
  --surface: #fff;
  --border: #E8D1D7;
  --header-bg: #800020;
  --header-text: #fff;
  --pk: #800020;
  --fk: #9B6B7A;
  --text: #2D1A1E;
  --muted: #7A5A62;
  --line: #BE7D8D;
  --line-mn: #9B6B7A;
  --shadow: 0 2px 8px rgba(128,0,32,.10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A1014;
    --surface: #241820;
    --border: #4A2D35;
    --header-bg: #540015;
    --header-text: #F4E8EB;
    --pk: #E8A0B0;
    --fk: #C49AAA;
    --text: #F4E8EB;
    --muted: #C49AAA;
    --line: #BE7D8D;
    --line-mn: #9B6B7A;
    --shadow: 0 2px 8px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --bg: #1A1014;
  --surface: #241820;
  --border: #4A2D35;
  --header-bg: #540015;
  --header-text: #F4E8EB;
  --pk: #E8A0B0;
  --fk: #C49AAA;
  --text: #F4E8EB;
  --muted: #C49AAA;
  --line: #BE7D8D;
  --line-mn: #9B6B7A;
  --shadow: 0 2px 8px rgba(0,0,0,.4);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  padding: 2rem 1rem 3rem;
}
h1 {
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 1.15rem;
  color: var(--header-bg);
  letter-spacing: .05em;
  text-transform: uppercase;
  text-align: center;
  margin-bottom: .4rem;
}
.subtitle {
  text-align: center;
  font-size: .82rem;
  color: var(--muted);
  margin-bottom: 1.5rem;
}
.diagram-wrap {
  max-width: 960px;
  margin: 0 auto;
  overflow-x: auto;
}
svg {
  display: block;
  max-width: 100%;
  height: auto;
}

/* Legend */
.legend {
  display: flex;
  justify-content: center;
  gap: 2rem;
  flex-wrap: wrap;
  margin-top: 1.4rem;
  font-size: .78rem;
  color: var(--muted);
}
.legend-item { display: flex; align-items: center; gap: .45rem; }
.legend-line { width: 28px; height: 2px; }
.legend-line--solid { background: var(--line); }
.legend-line--dashed { background: repeating-linear-gradient(90deg, var(--line-mn) 0, var(--line-mn) 5px, transparent 5px, transparent 9px); height: 2px; }
.leg-pk { width: 10px; height: 10px; border-radius: 2px; background: var(--pk); }
.leg-fk { width: 10px; height: 10px; border-radius: 2px; background: var(--fk); }
.leg-attr { width: 10px; height: 10px; border-radius: 2px; background: var(--border); }
</style>
