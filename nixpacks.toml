[phases.setup]
nixPkgs = [
    "php83", "php83Extensions.pdo_mysql", "php83Extensions.pdo",
    "php83Extensions.mbstring", "php83Extensions.xml", "php83Extensions.ctype",
    "php83Extensions.iconv", "php83Extensions.intl", "php83Extensions.curl",
    "php83Extensions.zip", "php83Extensions.mongodb", "php83Extensions.fileinfo",
    "curl"
]

[phases.install]
cmds = [
    "curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer",
    "composer install --no-dev --optimize-autoloader --no-interaction"
]

[phases.build]
cmds = [
    "php bin/console assets:install --env=prod --no-interaction",
    "php bin/console cache:clear --env=prod --no-interaction",
    "php bin/console cache:warmup --env=prod --no-interaction"
]

[start]
cmd = "bash railway-deploy.sh"
